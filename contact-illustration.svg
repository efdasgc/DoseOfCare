<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contactTitle">
  <title id="contactTitle">Illustration of an envelope and a phone representing contact</title>
  <circle cx="280" cy="210" r="185" fill="#E4EFE9"/>

  <!-- envelope -->
  <g transform="translate(180,140)">
    <rect x="0" y="0" width="220" height="150" rx="12" fill="#FFFFFF" stroke="#16323A" stroke-width="3.5"/>
    <path d="M0 14 L110 90 L220 14" fill="none" stroke="#6E9B87" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="18" y="112" width="70" height="10" rx="3" fill="#D9A441"/>
  </g>

  <!-- phone -->
  <g transform="translate(60,230)">
    <rect x="0" y="0" width="70" height="110" rx="14" fill="#16323A"/>
    <rect x="8" y="12" width="54" height="78" rx="4" fill="#A9C9B8"/>
    <circle cx="35" cy="98" r="4" fill="#F2F7F4"/>
  </g>

  <!-- pin -->
  <g transform="translate(430,260)">
    <path d="M0 0 C0 0 30 -30 30 -55 A30 30 0 1 0 -30 -55 C-30 -30 0 0 0 0 Z" fill="#D9A441"/>
    <circle cx="0" cy="-55" r="12" fill="#FFFFFF"/>
  </g>
</svg>

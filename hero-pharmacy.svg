<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Illustration of a labeled medicine bottle and pharmacy counter</title>
  <defs>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#88AE9B"/>
      <stop offset="100%" stop-color="#6E9B87"/>
    </linearGradient>
  </defs>

  <!-- backdrop circle -->
  <circle cx="320" cy="270" r="230" fill="#E4EFE9"/>
  <circle cx="320" cy="270" r="230" fill="none" stroke="#CBDED3" stroke-width="1.5" stroke-dasharray="2 8"/>

  <!-- counter shelf -->
  <rect x="70" y="430" width="500" height="18" rx="4" fill="#16323A"/>
  <rect x="70" y="448" width="500" height="8" rx="2" fill="#0F2429"/>

  <!-- small bottle left -->
  <g>
    <rect x="140" y="330" width="70" height="100" rx="10" fill="#FFFFFF" stroke="#16323A" stroke-width="3"/>
    <rect x="155" y="310" width="40" height="26" rx="6" fill="#16323A"/>
    <rect x="146" y="356" width="58" height="52" rx="4" fill="#D9A441"/>
    <line x1="152" y1="368" x2="198" y2="368" stroke="#16323A" stroke-width="2"/>
    <line x1="152" y1="378" x2="198" y2="378" stroke="#16323A" stroke-width="2"/>
    <line x1="152" y1="388" x2="184" y2="388" stroke="#16323A" stroke-width="2"/>
  </g>

  <!-- main bottle center -->
  <g>
    <rect x="255" y="220" width="130" height="210" rx="18" fill="url(#bottleGrad)" stroke="#16323A" stroke-width="3.5"/>
    <rect x="283" y="188" width="74" height="42" rx="8" fill="#16323A"/>
    <rect x="290" y="200" width="60" height="18" rx="4" fill="#F2F7F4"/>
    <!-- label -->
    <rect x="268" y="260" width="104" height="118" rx="6" fill="#FFFFFF"/>
    <rect x="268" y="260" width="104" height="26" rx="6" fill="#16323A"/>
    <text x="320" y="277" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#F2F7F4" letter-spacing="2">RX LABEL</text>
    <line x1="282" y1="300" x2="358" y2="300" stroke="#B7C8BF" stroke-width="2"/>
    <line x1="282" y1="314" x2="358" y2="314" stroke="#B7C8BF" stroke-width="2"/>
    <line x1="282" y1="328" x2="340" y2="328" stroke="#B7C8BF" stroke-width="2"/>
    <rect x="282" y="344" width="76" height="24" rx="4" fill="#F2F7F4" stroke="#D9A441" stroke-width="2"/>
    <text x="320" y="360" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#16323A" letter-spacing="1">TAKE DAILY</text>
  </g>

  <!-- small bottle right -->
  <g>
    <rect x="430" y="345" width="64" height="85" rx="10" fill="#FFFFFF" stroke="#16323A" stroke-width="3"/>
    <rect x="444" y="326" width="36" height="24" rx="6" fill="#16323A"/>
    <rect x="436" y="368" width="52" height="46" rx="4" fill="#6E9B87"/>
    <line x1="442" y1="380" x2="482" y2="380" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="442" y1="390" x2="482" y2="390" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- floating cross badge -->
  <g transform="translate(452,170)">
    <circle cx="0" cy="0" r="34" fill="#D9A441"/>
    <rect x="-16" y="-5" width="32" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="-5" y="-16" width="10" height="32" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- floating pill capsule -->
  <g transform="translate(150,210) rotate(-25)">
    <rect x="-28" y="-14" width="56" height="28" rx="14" fill="#FFFFFF" stroke="#16323A" stroke-width="2.5"/>
    <path d="M0,-14 L0,14" stroke="#16323A" stroke-width="2.5"/>
    <rect x="-28" y="-14" width="28" height="28" rx="14" fill="#A9C9B8"/>
  </g>

  <!-- heart pulse line -->
  <path d="M90 300 h40 l12 -26 l16 46 l14 -60 l12 40 h40" fill="none" stroke="#16323A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
</svg>
